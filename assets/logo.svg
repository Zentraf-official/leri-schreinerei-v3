<?xml version="1.0" encoding="UTF-8"?>
<!-- Logotipo REAL de LERI Schreinerei AG, redibujado en vector para que nunca pierda calidad.
     Geometría y colores medidos píxel a píxel de su archivo original:
       · L, E, I  →  verde  #007B35
       · R        →  gris   #565655 (su R no lleva asta izquierda: barra superior,
                     curva derecha, barra central y pata en diagonal; tal cual es)
       · SCHREINEREI → gris #565655, fino, con el mismo ancho que LERI
     Caja real del original: 340 × 314 px, contenido en x 29–310, y 29–283. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 314" role="img" aria-label="LERI Schreinerei AG">
  <title>LERI Schreinerei AG</title>
  <!-- L -->
  <path fill="#007B35" d="M29 29h12v168h66v12H29z"/>
  <!-- E -->
  <path fill="#007B35" d="M115 29h81v12h-69v70h57v9h-57v78h73v11h-85z"/>
  <!-- I -->
  <path fill="#007B35" d="M298 29h12v180h-12z"/>
  <!-- R sin asta izquierda (el rasgo propio de su logo) -->
  <g fill="#565655">
    <path d="M209 29h37c27 0 37 18 37 45 0 27-10 36-28 36h-46v-9h37c15 0 23-11 23-27 0-24-7-33-23-33h-37z"/>
    <path d="M234 119h14l42 89h-14z"/>
  </g>
  <!-- SCHREINEREI -->
  <text x="29" y="283" fill="#565655" font-family="HelveticaNeue-Light,'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="66" font-weight="300" textLength="281" lengthAdjust="spacingAndGlyphs">SCHREINEREI</text>
</svg>
